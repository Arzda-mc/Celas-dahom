<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کلاس دهم | بانک سؤالات و جزوات</title><style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root {
--bg:#f5f7fb;
--card:#ffffff;
--text:#202b40;
--muted:#77839a;
--primary:#635bdb;
--border:#e8ebf2;
}

.dark {
--bg:#111827;
--card:#1f2937;
--text:#f3f4f6;
--muted:#aab4c5;
--border:#374151;
}

* {box-sizing:border-box}

body {
margin:0;
font-family:'Vazirmatn',sans-serif;
background:var(--bg);
color:var(--text);
transition:.3s;
}

header {
background:var(--card);
border-bottom:1px solid var(--border);
padding:15px 5%;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:10;
}

.logo {
font-size:23px;
font-weight:800;
color:var(--primary);
}

.logo span {color:var(--text)}

button {
font-family:inherit;
cursor:pointer;
border:none;
}

.theme {
background:var(--bg);
color:var(--text);
padding:10px 14px;
border-radius:12px;
}

.hero {
margin:25px auto;
width:90%;
max-width:1100px;
padding:45px 25px;
border-radius:25px;
color:white;
background:linear-gradient(120deg,#635bdb,#3989d8);
}

.hero h1 {font-size:30px;margin:0 0 12px}
.hero p {line-height:2;margin:0 0 20px;color:#eee}

.search {
width:100%;
max-width:500px;
padding:14px;
border-radius:12px;
border:none;
font-family:inherit;
outline:none;
}

.container {
width:90%;
max-width:1100px;
margin:35px auto;
}

.section-title {
font-size:22px;
font-weight:800;
margin-bottom:20px;
}

.subjects {
display:grid;
grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
gap:15px;
}

.subject {
background:var(--card);
padding:22px 10px;
border:1px solid var(--border);
border-radius:18px;
text-align:center;
cursor:pointer;
transition:.2s;
}

.subject:hover {
transform:translateY(-5px);
border-color:var(--primary);
}

.subject .icon {font-size:30px}
.subject h3 {font-size:15px;margin:10px 0 0}

.filters {
display:flex;
gap:10px;
flex-wrap:wrap;
margin:20px 0;
}

.filter {
background:var(--card);
border:1px solid var(--border);
color:var(--text);
padding:9px 17px;
border-radius:20px;
}

.filter.active {
background:var(--primary);
color:white;
}

.questions {
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:15px;
}

.question {
background:var(--card);
padding:20px;
border:1px solid var(--border);
border-radius:17px;
}

.question h3 {font-size:16px;line-height:1.9}

.tag {
color:var(--primary);
font-size:12px;
font-weight:bold;
}

.answer {
display:none;
background:var(--bg);
padding:13px;
border-radius:12px;
line-height:2;
margin-top:12px;
}

.show-answer {
background:var(--primary);
color:white;
padding:9px 15px;
border-radius:9px;
margin-top:10px;
}

.quiz {
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
padding:22px;
margin-top:35px;
}

.quiz button.option {
display:block;
width:100%;
text-align:right;
padding:13px;
margin:10px 0;
border-radius:10px;
background:var(--bg);
color:var(--text);
border:1px solid var(--border);
}

.quiz button.option:hover {
border-color:var(--primary);
}

#quizResult {
margin-top:15px;
font-weight:bold;
}

footer {
margin-top:60px;
padding:30px;
text-align:center;
background:var(--card);
border-top:1px solid var(--border);
color:var(--muted);
line-height:2;
}

.empty {
text-align:center;
padding:30px;
color:var(--muted);
}

@media(max-width:600px){
.hero h1{font-size:23px}
.hero{padding:30px 20px}
header{padding:13px 5%}
}
</style></head><body><header>
<div class="logo">📚 <span>کلاس دهم</span></div>
<button class="theme" onclick="toggleTheme()">🌙 تغییر حالت</button>
</header><section class="hero">
<h1>به کلاس دهم خوش آمدید!</h1>
<p>مرجع سؤالات امتحانی، پاسخ‌نامه و جزوات آموزشی پایه دهم</p>
<input class="search" id="search" placeholder="🔍 جست‌وجو در سؤالات و دروس..." oninput="renderQuestions()">
</section><main class="container"><h2 class="section-title">📚 کتاب‌های درسی</h2><div class="subjects" id="subjects"></div><h2 class="section-title" style="margin-top:40px">📝 بانک سؤالات امتحانی</h2><div class="filters" id="filters"></div><div class="questions" id="questions"></div><section class="quiz">
<h2>🎯 آزمون آنلاین</h2>
<p>به سؤال زیر پاسخ بده و نتیجه را مشاهده کن.</p><div id="quizQuestion"></div>
<div id="quizResult"></div>
<button class="show-answer" onclick="nextQuiz()">سؤال بعدی ←</button>
</section></main><footer>
<strong>کلاس دهم</strong><br>
بانک سؤالات و جزوات آموزشی پایه دهم<br>
ساخته شده با ❤️ برای دانش‌آموزان
</footer><script>

const subjects = [
{name:"ریاضی",icon:"📐"},
{name:"فیزیک",icon:"⚡"},
{name:"شیمی",icon:"🧪"},
{name:"زیست‌شناسی",icon:"🧬"},
{name:"فارسی",icon:"📖"},
{name:"عربی",icon:"📝"},
{name:"زبان انگلیسی",icon:"🌍"},
{name:"دین و زندگی",icon:"📚"},
{name:"جغرافیا",icon:"🌏"},
{name:"تاریخ",icon:"🏛️"},
{name:"هندسه",icon:"📏"},
{name:"آمادگی دفاعی",icon:"🎓"}
];

const questions = [
{
subject:"ریاضی",
text:"حاصل عبارت ۲ به توان ۳ به‌علاوه ۳ به توان ۲ چند است؟",
answer:"۲ به توان ۳ برابر ۸ و ۳ به توان ۲ برابر ۹ است. بنابراین حاصل برابر ۱۷ می‌شود."
},
{
subject:"فیزیک",
text:"یکای اندازه‌گیری نیرو در دستگاه SI چیست؟",
answer:"نیوتون (N)."
},
{
subject:"شیمی",
text:"اتم از چه ذرات اصلی تشکیل شده است؟",
answer:"پروتون، نوترون و الکترون."
},
{
subject:"زیست‌شناسی",
text:"وظیفه اصلی میتوکندری در سلول چیست؟",
answer:"میتوکندری در فرایند تولید انرژی قابل استفاده سلول نقش اساسی دارد."
},
{
subject:"فارسی",
text:"منظور از تشبیه چیست؟",
answer:"تشبیه یعنی مانند کردن چیزی به چیز دیگر به دلیل داشتن ویژگی مشترک."
},
{
subject:"جغرافیا",
text:"جغرافیا چه علمی است؟",
answer:"علم بررسی پدیده‌های طبیعی و انسانی در سطح زمین و ارتباط میان آن‌ها."
}
];

let currentFilter="همه";

function renderSubjects(){
document.getElementById("subjects").innerHTML=
subjects.map(s=>`
<div class="subject" onclick="selectSubject('${s.name}')">
<div class="icon">${s.icon}</div>
<h3>${s.name}</h3>
</div>`).join("");
}

function renderFilters(){
const names=["همه",...subjects.map(s=>s.name)];
document.getElementById("filters").innerHTML=
names.map(n=>`
<button class="filter ${currentFilter===n?'active':''}"
onclick="setFilter('${n}')">${n}</button>
`).join("");
}

function setFilter(name){
currentFilter=name;
renderFilters();
renderQuestions();
}

function selectSubject(name){
currentFilter=name;
renderFilters();
renderQuestions();
document.querySelector(".section-title").scrollIntoView({behavior:"smooth"});
}

function renderQuestions(){
const search=document.getElementById("search").value.trim();
const result=questions.filter(q=>
(currentFilter==="همه"||q.subject===currentFilter)&&
(q.text.includes(search)||q.subject.includes(search))
);

document.getElementById("questions").innerHTML=result.length?
result.map((q,i)=>`
<div class="question">
<span class="tag">${q.subject}</span>
<h3>${q.text}</h3>
<button class="show-answer" onclick="toggleAnswer(${questions.indexOf(q)})">مشاهده پاسخ</button>
<div class="answer" id="answer-${questions.indexOf(q)}">${q.answer}</div>
</div>
`).join(""):'<div class="empty">سؤالی پیدا نشد!</div>';
}

function toggleAnswer(id){
const el=document.getElementById("answer-"+id);
el.style.display=el.style.display==="block"?"none":"block";
}

function toggleTheme(){
document.body.classList.toggle("dark");
}

const quiz=[
{
q:"حاصل ۵ × ۶ چند است؟",
options:["۲۰","۳۰","۳۵","۴۰"],
answer:1
},
{
q:"نماد شیمیایی اکسیژن چیست؟",
options:["O","H","N","C"],
answer:0
},
{
q:"کدام سیاره به سیاره سرخ معروف است؟",
options:["زهره","مشتری","مریخ","عطارد"],
answer:2
}
];

let quizIndex=0;
let score=0;
let answered=false;

function renderQuiz(){
const q=quiz[quizIndex];
answered=false;

document.getElementById("quizResult").innerText="";

document.getElementById("quizQuestion").innerHTML=`
<h3>${quizIndex+1}. ${q.q}</h3>
${q.options.map((o,i)=>`
<button class="option" onclick="checkAnswer(${i})">${o}</button>
`).join("")}
`;
}

function checkAnswer(i){
if(answered)return;
answered=true;

if(i===quiz[quizIndex].answer){
score++;
document.getElementById("quizResult").innerText="✅ آفرین! پاسخ درست است.";
}else{
document.getElementById("quizResult").innerText=
"❌ پاسخ درست: "+quiz[quizIndex].options[quiz[quizIndex].answer];
}
}

function nextQuiz(){
quizIndex++;
if(quizIndex>=quiz.length){
document.getElementById("quizQuestion").innerHTML=
"<h3>آزمون تمام شد!</h3><p>امتیاز شما: "+score+" از "+quiz.length+"</p>";
document.getElementById("quizResult").innerText="";
quizIndex=0;
score=0;
return;
}
renderQuiz();
}

renderSubjects();
renderFilters();
renderQuestions();
renderQuiz();

</script></body>
  </html>
